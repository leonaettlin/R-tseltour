<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schnitzeljagd</title>
    <link rel="stylesheet" href="css/css.css">
</head>
<body>
    <form class="app" action="form2.html" method="get">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">Weiter gehts</h2>
                <p class="card-text">Hier kommt das nächste Rätsel</p>
                <label class="card-label" for="eingabefeld">Die konkrete Frage wiederholt</label>
            </div>
            <input class="pill-input" type="text" id="eingabefeld" name="eingabefeld" pattern="0\.14" title="Wenn etwas falsch eingegeben wurde" required placeholder="Antwort eingeben">
        </div>

        <div class="button-row">
            <button class="btn btn-primary" type="submit">Weiter</button>
            <button class="btn btn-secondary" type="button" onclick="document.getElementById('tipp').classList.add('open')">Tipp öffnen</button>
        </div>
    </form>

    <div id="tipp" class="modal" onclick="if(event.target===this)this.classList.remove('open')">
        <div class="modal-card">
            <button class="modal-close" type="button" onclick="document.getElementById('tipp').classList.remove('open')" aria-label="Schliessen">&times;</button>
            <h3 class="modal-title">Tipp</h3>
            <p class="modal-text">Welchen Tipp wollen Sie weitergeben?</p>
        </div>
    </div>

    <footer class="site-footer">
        Amsa, Isabel, Leona, Rania, Matteo, Kalle, Eliane, Kay und Janine · 2026
    </footer>
</body>
</html>
